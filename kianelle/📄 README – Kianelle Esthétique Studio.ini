📄 README – Kianelle Esthétique Studio

Sitio web funcional con formularios conectados a base de datos
Proyecto final – Desarrollo Integrador de Páginas Web con Bases de Datos

🌟 Descripción del Proyecto

Kianelle Esthétique Studio es un sitio web desarrollado como proyecto integrador para
demostrar el uso de tecnologías web modernas junto con una base de datos MySQL. El 
sistema permite que los usuarios contacten al estudio mediante un formulario y reserven 
citas en línea. Toda la información enviada se almacena en una base de datos real mediante 
un backend creado en PHP.

🎯 Objetivo del Proyecto

Diseñar, desarrollar y publicar un sitio web funcional para un estudio de 
estética que permita gestionar mensajes de clientes y agendar citas mediante 
una conexión dinámica a una base de datos.

⚙️ Tecnologías Utilizadas
Frontend

HTML5

CSS3

JavaScript

Backend

PHP (procesamiento de formularios y conexión a BD)

Base de Datos

MySQL

phpMyAdmin

Entorno de Desarrollo

XAMPP (servidor local)

Dominio: http://localhost/kianelle/index.html

🏗️ Estructura del Sitio

El sitio incluye las siguientes páginas:

index.html – Página inicial

services.html – Servicios ofrecidos

about-me.html – Información del estudio

contact-me.html – Formulario de contacto

citas.html – Formulario para reservar citas

backend/ – Scripts PHP (contacto, citas y conexión a la base de datos)

🗄️ Diseño de la Base de Datos
Tabla: contactos
Campo	Tipo	Descripción
id	INT, PK, AI	Identificador único
nombre	VARCHAR	Nombre del usuario
email	VARCHAR	Correo electrónico
mensaje	TEXT	Mensaje enviado
fecha_envio	TIMESTAMP	Fecha del envío

Tabla: citas
Campo	Tipo	Descripción
id	INT, PK, AI	Identificador único
servicio	VARCHAR	Tipo de servicio
fecha	DATE	Fecha seleccionada
hora	TIME	Hora de la cita
nombre	VARCHAR	Nombre
apellido	VARCHAR	Apellido
telefono	VARCHAR	Teléfono
email	VARCHAR	Correo
comentarios	TEXT	Notas del cliente
fecha_creacion	TIMESTAMP	Fecha de registro

🔌 Funcionamiento del Backend
1. contacto.php

Recibe datos mediante JSON y los inserta en la tabla contactos.

2. crear_cita.php

Procesa las reservas y almacena los datos en la tabla citas.

3. db.php

Archivo central de conexión a MySQL utilizando PDO.


🚀 Características del Proyecto

Envío de mensajes mediante formulario dinámico

Sistema de reservas con validación

Almacenamiento real en base de datos

Backend seguro con PDO

Dominio público funcional

📌 Conclusiones

Este proyecto permitió integrar frontend, backend y base de datos en un sitio funcional. Además, se desarrolló experiencia en el uso de PHP, MySQL, servidores locales y publicación en hosting gratuito. El sistema es escalable y puede seguir ampliándose con inicio de sesión, panel administrativo y herramientas de gestión.

